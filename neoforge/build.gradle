plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

base {
    archivesName = "${mod_id}-neoforge-${version_mc}-${mod_version}"
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${version_neoforge}"
    compileOnly project(':common')

    // Curios
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${version_curios}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${version_curios}:api"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('compileJava', JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(Jar).configureEach {
    exclude('nomowanderer/NeoForgeGameTests.class')
}

tasks.jarJar.configure {
    archiveClassifier.set("")
    from(rootProject.file("LICENSE"))
}

tasks.named('processResources', ProcessResources).configure {
    from project(":common").sourceSets.main.resources
}

tasks.register('copyTestWorld', Copy) {
    from rootProject.file("common/test_world_template")
    into "runs/client/saves/test_world"
    onlyIf { rootProject.file("common/test_world_template").exists() }
    doFirst {
        delete "runs/client/saves/test_world"
    }
}
