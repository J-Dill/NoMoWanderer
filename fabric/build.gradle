plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric-${version_mc}-${mod_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${version_mc}"

    implementation "net.fabricmc:fabric-loader:${version_fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${version_fabric}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    implementation project(":common")
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    from project(":common").sourceSets.main.resources
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.register('copyTestWorld', Copy) {
    from rootProject.file("common/test_world_template")
    into "run/saves/test_world"
    onlyIf { rootProject.file("common/test_world_template").exists() }
    doFirst {
        delete "run/saves/test_world"
    }
}
