plugins {
    id 'idea'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
}

version = "${version_mc}_${mod_version}"
group = "${mod_group}"

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    processResources {
        var replaceProperties = [
                minecraft_version: version_mc, minecraft_version_range: version_range_mc,
                forge_version: version_forge, forge_version_range: version_range_forge,
                version_range_forge: version_range_forge,
                mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                mod_authors: mod_authors, mod_description: mod_description, mod_issues: mod_issues, mod_url: mod_url,
                neoforge_version: version_neoforge, neoforge_version_range: version_neoforge_range
        ]
        filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta', 'fabric.mod.json']) {
            expand replaceProperties
        }
        inputs.properties replaceProperties
    }

    jar {
        archiveClassifier.set("plain")
        from(rootProject.file("LICENSE"))
        manifest {
            attributes([
                    'Specification-Title'     : "${mod_name}",
                    'Specification-Vendor'    : "${mod_authors}",
                    'Specification-Version'   : "1",
                    'Implementation-Title'    : "${project.name}",
                    'Implementation-Version'  : "${project.jar.archiveVersion}",
                    'Implementation-Vendor'   : "${mod_authors}",
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestamp'               : System.currentTimeMillis(),
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : "${version_mc}"
            ])
        }
    }

    repositories {
        mavenCentral()
        maven {
            url "https://www.cursemaven.com"
        }
        maven { // Curios API
            url 'https://maven.theillusivec4.top/'
        }
        maven {
            // JEI
            name = "Progwml6 maven"
            url = "https://dvs1.progwml6.com/files/maven/"
        }
        maven {
            // JEI backup
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        exclude('data/nomowanderer/structures/trader_platform.nbt')
        exclude('data/nomowanderer/structures/trader_platform_rug.nbt')
        exclude('data/nomowanderer/structures/trader_platform_talisman.nbt')
    }
}