name: Build & Publish Mod

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Which job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'version-check'
          - 'build'
          - 'release-github'
          - 'publish-curseforge'
          - 'publish-modrinth'
          - 'publish-curseforge-neoforge'
          - 'publish-curseforge-forge'
          - 'publish-curseforge-fabric'
          - 'publish-modrinth-neoforge'
          - 'publish-modrinth-forge'
          - 'publish-modrinth-fabric'
      version_override:
        description: 'Override version (optional, leave empty to use gradle.properties)'
        required: false
        type: string
      skip_version_check:
        description: 'Skip version check and force run'
        required: false
        type: boolean
        default: false

jobs:

  version-check:
    name: "🏷️ Check Version & Create Tag"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.job_to_run == 'all' || inputs.job_to_run == 'version-check'
    outputs:
      continue: ${{ steps.continue-build.outputs.continue }}
      new-tag: ${{ steps.determine-version.outputs.version }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📋 Get Current Mod Version"
        uses: madhead/read-java-properties@2.1.0
        id: load-props
        with:
          file: ./gradle.properties
          property: mod_version

      - name: "🔧 Determine Version to Use"
        id: determine-version
        run: |
          if [[ "${{ inputs.version_override }}" != "" ]]; then
            echo "version=v${{ inputs.version_override }}" >> $GITHUB_OUTPUT
            echo "Using override version: ${{ inputs.version_override }}"
          else
            echo "version=v${{ steps.load-props.outputs.value }}" >> $GITHUB_OUTPUT
            echo "Using gradle.properties version: ${{ steps.load-props.outputs.value }}"
          fi

      - name: "🔍 Retrieve Latest Version"
        id: get-version
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest-tag=${last_tag:1}" >> $GITHUB_OUTPUT
          echo "Latest tag: $last_tag"

      - name: "❓ Continue Build?"
        id: continue-build
        run: |
          if [[ "${{ inputs.skip_version_check }}" == "true" ]]; then
            echo "continue=true" >> $GITHUB_OUTPUT
            echo "Skipping version check - forcing run"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "continue=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - proceeding with build"
          elif [[ "${{ steps.load-props.outputs.value }}" != "${{ steps.get-version.outputs.latest-tag }}" ]]; then
            echo "continue=true" >> $GITHUB_OUTPUT
            echo "New version detected - proceeding with build"
          else
            echo "continue=false" >> $GITHUB_OUTPUT
            echo "No new version - skipping build"
          fi

      - name: "🏷️ Tag Commit w/ Version"
        uses: rickstaa/action-create-tag@v1.3.7
        if: steps.continue-build.outputs.continue == 'true' && github.event_name != 'workflow_dispatch'
        with:
          tag: ${{ steps.determine-version.outputs.version }}
          github_token: ${{ secrets.TOKEN }}

  build:
    name: "🔨 Build"
    runs-on: ubuntu-latest
    needs: version-check
    if: |
      always() && 
      (needs.version-check.outputs.continue == 'true' || 
       inputs.job_to_run == 'build' || 
       (inputs.job_to_run == 'all' && github.event_name == 'workflow_dispatch'))

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "☕ Set up JDK 21"
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: "⚙️ Build with Gradle"
        id: build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build

      - name: "📦 Upload Forge JAR"
        uses: actions/upload-artifact@v4
        with:
          name: jar-forge
          path: |
            ./forge/build/libs/*.jar
            !./forge/build/libs/*-plain.jar

      - name: "📦 Upload NeoForge JAR"
        uses: actions/upload-artifact@v4
        with:
          name: jar-neoforge
          path: |
            ./neoforge/build/libs/*.jar
            !./neoforge/build/libs/*-plain.jar

      - name: "📦 Upload Fabric JAR"
        uses: actions/upload-artifact@v4
        with:
          name: jar-fabric
          path: |
            ./fabric/build/libs/*.jar
            !./fabric/build/libs/*-plain.jar

  release-github:
    name: "📦 Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [ build, version-check ]
    if: |
      always() && 
      (needs.version-check.outputs.continue == 'true' || 
       inputs.job_to_run == 'release-github' || 
       (inputs.job_to_run == 'all' && github.event_name == 'workflow_dispatch'))

    outputs:
      changelog: ${{ steps.get-release-changelog.outputs.body }}

    permissions:
      contents: write

    steps:
      - name: "📥 Download JARs"
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: ./build/

      - name: "🚀 Create GitHub Release"
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-tag: ${{ needs.version-check.outputs.new-tag }}
          github-generate-changelog: true
          github-draft: false
          github-prerelease: false
          github-token: ${{ secrets.TOKEN }}

          files: |
            ./build/jar-forge/*.jar
            ./build/jar-neoforge/*.jar
            ./build/jar-fabric/*.jar

          name: ""
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release

          loaders: |
            fabric
            forge
            neoforge
          java: |
            Java 21
            21

      - name: "📄 Get Release Changelog"
        id: get-release-changelog
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag: ${{ needs.version-check.outputs.new-tag }}

  publish-curseforge:
    name: "🔥 Publish to CurseForge"
    runs-on: ubuntu-latest
    needs: [version-check, build, release-github]
    if: |
      always() && 
      (needs.version-check.outputs.continue == 'true' || 
       inputs.job_to_run == 'publish-curseforge' ||
       contains(inputs.job_to_run, 'publish-curseforge-') ||
       (inputs.job_to_run == 'all' && github.event_name == 'workflow_dispatch'))

    steps:
      - name: "📥 Download All JARs"
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: ./build/

      - name: "🔥 Publish NeoForge to CurseForge"
        if: inputs.job_to_run == 'all' || inputs.job_to_run == 'publish-curseforge' || inputs.job_to_run == 'publish-curseforge-neoforge' || github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 354428
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

          files: |
            ./build/jar-neoforge/*.jar

          name: ""
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release
          changelog: ${{ needs.release-github.outputs.changelog }}

          loaders: |
            neoforge
          java: |
            Java 21
            21

      - name: "🔥 Publish Forge to CurseForge"
        if: inputs.job_to_run == 'all' || inputs.job_to_run == 'publish-curseforge' || inputs.job_to_run == 'publish-curseforge-forge' || github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 354428
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

          files: |
            ./build/jar-forge/*.jar

          name: ""
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release
          changelog: ${{ needs.release-github.outputs.changelog }}

          loaders: |
            forge
          java: |
            Java 21
            21

      - name: "🔥 Publish Fabric to CurseForge"
        if: inputs.job_to_run == 'all' || inputs.job_to_run == 'publish-curseforge' || inputs.job_to_run == 'publish-curseforge-fabric' || github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 354428
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

          files: |
            ./build/jar-fabric/*.jar

          name: ""
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release
          changelog: ${{ needs.release-github.outputs.changelog }}

          loaders: |
            fabric
          java: |
            Java 21
            21

  publish-modrinth:
    name: "💎 Publish to Modrinth"
    runs-on: ubuntu-latest
    needs: [version-check, build, release-github]
    if: |
      always() && 
      (needs.version-check.outputs.continue == 'true' || 
       inputs.job_to_run == 'publish-modrinth' ||
       contains(inputs.job_to_run, 'publish-modrinth-') ||
       (inputs.job_to_run == 'all' && github.event_name == 'workflow_dispatch'))

    steps:
      - name: "📥 Download All JARs"
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: ./build/

      - name: "💎 Publish NeoForge to Modrinth"
        if: inputs.job_to_run == 'all' || inputs.job_to_run == 'publish-modrinth' || inputs.job_to_run == 'publish-modrinth-neoforge' || github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: BAGslLB8
          modrinth-featured: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            ./build/jar-neoforge/*.jar

          name: "NoMoWanderer - NeoForge - ${{ needs.version-check.outputs.new-tag }}"
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release
          changelog: ${{ needs.release-github.outputs.changelog }}

          loaders: |
            neoforge
          java: |
            Java 21
            21

      - name: "💎 Publish Forge to Modrinth"
        if: inputs.job_to_run == 'all' || inputs.job_to_run == 'publish-modrinth' || inputs.job_to_run == 'publish-modrinth-forge' || github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: BAGslLB8
          modrinth-featured: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            ./build/jar-forge/*.jar

          name: "NoMoWanderer - Forge - ${{ needs.version-check.outputs.new-tag }}"
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release
          changelog: ${{ needs.release-github.outputs.changelog }}

          loaders: |
            forge
          java: |
            Java 21
            21

      - name: "💎 Publish Fabric to Modrinth"
        if: inputs.job_to_run == 'all' || inputs.job_to_run == 'publish-modrinth' || inputs.job_to_run == 'publish-modrinth-fabric' || github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: BAGslLB8
          modrinth-featured: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            ./build/jar-fabric/*.jar

          name: "NoMoWanderer - Fabric - ${{ needs.version-check.outputs.new-tag }}"
          version: ${{ needs.version-check.outputs.new-tag }}
          version-type: release
          changelog: ${{ needs.release-github.outputs.changelog }}

          loaders: |
            fabric
          java: |
            Java 21
            21
